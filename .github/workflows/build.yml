name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (signed with the repo's debug key)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk SkittlesPlayer.apk

      - name: Publish as latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Skittles Player build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: SkittlesPlayer.apk
          body: |
            Built from ${{ github.sha }} on `${{ github.ref_name }}`.

            Install on Fire TV with the Downloader app:
            https://github.com/${{ github.repository }}/releases/latest/download/SkittlesPlayer.apk
